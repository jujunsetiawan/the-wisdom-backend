apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-wisdom-api
  labels:
    app: kubernetes-wisdom-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-wisdom-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: kubernetes-wisdom-api
    spec:
      containers:
      - name: kubernetes-wisdom-api
        image: juntakeda10/the-wisdom-backend-api:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 3000
          name: wisdom-api
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        emptyDir: {}
      restartPolicy: Always